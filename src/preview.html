<body>
<div id="__status" class="status" style="display:none"></div>
<article id="__content" class="content"></article>
<script>
(function () {
    'use strict';
    var content = document.getElementById('__content');
    var status = document.getElementById('__status');
    window.__update = function (md) {
        status.style.display = 'none';
        content.style.display = 'block';
        content.innerHTML = marked.parse(md);
    };
    window.__setStatus = function (text) {
        content.style.display = 'none';
        status.textContent = text;
        status.style.display = 'block';
    };
})();
</script>
