<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
__PLUGIN_CSS__
</style>
<script>
__PLUGIN_MARKED__
</script>
</head>
<body>
<div id="__status" class="status">Loading preview...</div>
<article id="__content" class="content" style="display:none"></article>
<script>
(function () {
    'use strict';
    var content = document.getElementById('__content');
    var status = document.getElementById('__status');
    function fail(msg) {
        content.style.display = 'none';
        status.textContent = msg;
        status.style.display = 'block';
    }
    if (typeof marked === 'undefined') {
        fail('marked.js failed to load');
        return;
    }
    window.__update = function (md) {
        try {
            status.style.display = 'none';
            content.style.display = 'block';
            content.innerHTML = marked.parse(md);
        } catch (e) {
            fail('Render error: ' + (e && e.message ? e.message : String(e)));
        }
    };
    window.__setStatus = fail;
})();
</script>
</body>
</html>
